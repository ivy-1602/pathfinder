{% extends "base.html" %}
{% block title %}Create your profile{% endblock %}
{% block content %}
<div class="form-wrap mx-auto">
  <h1 class="h2 mb-1">Create your profile</h1>
  <p class="text-secondary mb-4">It takes a minute. You can change anything later.</p>
  <form method="post" class="feature-card" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" required autocomplete="name" value="{{ v.get('name','') }}"></div>
      <div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required autocomplete="email" value="{{ v.get('email','') }}"></div>
      <div class="col-md-6"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" minlength="8" required autocomplete="new-password"><div class="form-text">At least 8 characters.</div></div>
      <div class="col-md-6"><label class="form-label" for="confirm">Confirm password</label><input class="form-control" id="confirm" name="confirm" type="password" required autocomplete="new-password"></div>
      {% include "_profile_fields.html" %}
    </div>
    <button class="btn btn-dark btn-lg w-100 mt-4" type="submit">Create profile and see matches</button>
    <p class="small text-muted mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
  </form>
</div>
{% endblock %}
